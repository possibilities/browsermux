name: Verify native browser
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: python3 scripts/security-audit.py
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Restore native dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/cef
            target
            build/native
          key: native-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'cef-version.json', 'macos/CMakeLists.txt') }}
      - name: Verify Apple toolchain and architecture
        run: |
          uname -a
          xcodebuild -version
          xcrun swiftc --version
          test "$(uname -m)" = arm64
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - name: Rust native tests
        run: cargo test --locked --workspace
      - name: Build native AppKit and sandboxed CEF bundle
        run: scripts/build-macos.sh
      - name: Save native dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/cef
            target
            build/native
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Native browser isolation smoke test
        run: python3 tests/native_smoke.py
      - name: Package development app
        if: success()
        run: ditto -c -k --sequesterRsrc --keepParent 'build/browsermux.app' build/browsermux-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-verification-${{ github.sha }}
          path: |
            build/browsermux-macos-arm64.zip
            build/native-smoke.log
            build/native-smoke-results.json
          if-no-files-found: warn
          retention-days: 7
