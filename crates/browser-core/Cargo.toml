[package]
name = "browser-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license.workspace = true
description = "Engine-independent, transactional domain model for the native split-pane browser"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uuid = { version = "=1.20.0", features = ["v4", "serde"] }
url = "=2.5.8"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
thiserror = "=2.0.18"
